seeds:
# refresh_before: zonder dit slaat mapproxy-seed bestaande tiles over (ook witte).
# days: 7 = alles ouder dan 7 dagen opnieuw renderen; langer dan de looptijd van de job,
# zodat een herstarte pod de tiles van de vorige poging overslaat.
#### TOPO RD - KBK & BGT - Standaard kleur
  topo_rd_kbk:
    caches: [topo_rd_cache]
    grids: [nl_grid]
    coverages: ['kbk']
    levels:
      from: 6
      to: 11
    refresh_before:
      days: 7

