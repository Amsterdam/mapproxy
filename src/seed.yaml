coverages:
  kbk:
    bbox: [90000,464250,175000,520000]
    srs: 'EPSG:28992'
  bgt:
    bbox: [104000,474000,136000,502100]
    srs: 'EPSG:28992'
  # Outline of the 746 orthophotos of 2026 (1 km squares, 2026_<x>_<y>_RGB_JPEG_hrl.tif); extent
  # [109000,475000,139000,502000], the extent of the 2026 pyramid (overview/2026/pyramid on
  # stlufoglfdpgo{ont,prd}weu01, regenerated 2026-11-20), without its 64 km2 of empty corners.
  # Relative paths: MapProxy resolves them from the directory of mapproxy-seed.yaml (/app).
  lufo:
    datasource: coverages/lufo_coverage_rd.geojson
    srs: 'EPSG:28992'
  # Same outline in the webmercator grid's own srs. MapProxy reprojects a coverage per vertex and
  # simplifies away collinear points first, so the RD file would turn the long straight RD edges
  # into straight 3857 lines, up to 11 m off: white tiles just outside. The RD edges are densified
  # every 100 m before reprojecting.
  lufo_wm:
    datasource: coverages/lufo_coverage_wm.geojson
    srs: 'EPSG:3857'